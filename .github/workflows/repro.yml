name: repro

on:
  workflow_dispatch:
  push:

jobs:
  darwin-x64:
    name: darwin-x64 (${{ matrix.os }})
    strategy:
      matrix:
        os: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
      - run: npm install
      - run: npm run repro
